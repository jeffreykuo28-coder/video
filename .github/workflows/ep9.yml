name: Generate EP9 Chinese TTS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Edge TTS
        run: pip install edge-tts
      - name: Generate narration
        shell: bash
        run: |
          mkdir -p out
          cat > narration.txt <<'EOF'
          第三次看门锁，你确认的已经不是门了。你在确认：自己能不能放心停下来。

          第四次、第五次也是一样。因为门有没有锁，其实早就提供不了多少新信息。真正卡住你的，是脑子里还剩下的那一点：万一呢？

          决策科学里，一个判断系统要想正常工作，必须知道什么时候停止收集证据。很多模型会把它表示成 decision boundary，也就是决策阈值：证据够了，就停止采样，然后行动。

          OCD 研究里，一个很反常的现象是：有些人会收集更多证据、花更长时间，却仍然不容易真正停下来。

          这里有一个很反常识的地方。你以为确认是在消灭怀疑。但从系统设计的角度看，如果每次出现怀疑，你都追加一次计算，那你其实是在训练一个规则：只要还有怀疑，计算就不能结束。

          于是怀疑不需要战胜你。它只需要阻止程序退出。

          所以我想提出一个工作假说：Epistemic Halting Failure，认知停机失败。

          大白话就是：如果你的停止条件，被设成了零残余不确定性，那这个程序从设计上就没有自然终点。

          你可以检查门锁，但无法证明未来绝不会出任何意外。你可以知道此刻爱一个人，但无法证明未来每一秒的感受。你可以回忆过去，却无法证明记忆没有遗漏任何细节。

          新的证据不会自动结束问题。只要停止标准还是百分之百确定，新的证据也可以继续制造新的可怀疑之处。

          所以下次又想再确认一下时，可以换一个 stopping rule：现实中的证据，已经足够我正常行动了吗？

          如果够了，剩下那个万一，不必继续计算。

          理性，不只是知道该想什么。还包括知道什么时候，不该再想。

          当继续思考已经不再增加信息——停止，就是决策。
          EOF
          TEXT=$(cat narration.txt)
          edge-tts --voice zh-CN-YunxiNeural --rate=-3% --pitch=-2Hz --text "$TEXT" --write-media out/ep9_yunxi.mp3 --write-subtitles out/ep9_yunxi.srt
          cp narration.txt out/narration.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ep9-tts
          path: out/
          if-no-files-found: error
