name: Generate EP9 Chinese TTS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Edge TTS
        run: pip install edge-tts
      - name: Generate narration
        shell: bash
        run: |
          mkdir -p out
          cat > narration.txt <<'EOF'
          第三次看门锁，你确认的不是门。你在确认自己能不能放心停下来。

          第四次、第五次也一样。因为门锁早就没提供新信息，真正没被满足的是：我还不能百分之百确定。

          决策科学里，判断系统必须有停止规则。很多模型用 decision boundary，也就是决策阈值来表示：证据够了，跨过阈值，就停止采样，开始行动。

          OCD 研究里有个反常现象：有些人会收集更多证据，却仍然更难真正停下来。

          如果每次怀疑，都触发一次追加确认，你就在训练一个规则：只要还有怀疑，程序就不能退出。

          怀疑不必证明自己是对的。它只要让计算继续。

          所以我提出一个工作假说：Epistemic Halting Failure，认知停机失败。

          意思是：如果停止条件被设成“零残余不确定性”，这个程序从设计上就没有自然终点。

          门锁、感情、记忆都一样。现实证据可以足够，但很少绝对。

          于是第十次确认以后，总还能生产出第十一个“万一”。

          下次再想确认，换一个 stopping rule：现有证据，已经足够我正常行动了吗？

          如果够了，就允许问题带着一点不确定结束。

          理性不只是继续想。

          当继续思考已经不再增加信息——停止，就是决策。
          EOF
          TEXT=$(cat narration.txt)
          edge-tts --voice zh-CN-YunxiNeural --rate=-2% --pitch=-2Hz --text "$TEXT" --write-media out/ep9_yunxi.mp3 --write-subtitles out/ep9_yunxi.srt
          cp narration.txt out/narration.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ep9-tts
          path: out/
          if-no-files-found: error
